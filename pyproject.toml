[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "job-candidate-ranker"
version = "1.0.0"
description = "Reproducible candidate-to-job ranking pipeline"
requires-python = ">=3.10"
dependencies = ["joblib>=1.3", "numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3"]
[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
[project.scripts]
job-ranker = "job_candidate_ranker.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.ruff]
line-length = 100
[tool.pytest.ini_options]
testpaths = ["tests"]
